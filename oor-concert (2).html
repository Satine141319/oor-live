<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>OOR LIVE LYRICS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e8001a;
    --red-dim: #7a000d;
    --white: #f5f0eb;
    --off: #b0a89a;
    --bg: #080808;
    --surface: #111111;
    --line: rgba(255,255,255,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--white); font-family: 'Noto Sans TC', sans-serif; overflow: hidden; }

  #splash {
    position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; z-index: 999; transition: opacity 0.5s;
  }
  #splash.hide { opacity: 0; pointer-events: none; }
  .splash-logo { font-family: 'Bebas Neue', sans-serif; font-size: 52px; letter-spacing: 8px; color: var(--white); animation: fadein 0.8s ease both; }
  .splash-sub { font-size: 11px; letter-spacing: 4px; color: var(--red); text-transform: uppercase; animation: fadein 0.8s 0.3s ease both; opacity: 0; }
  @keyframes fadein { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    flex-shrink: 0; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 0 16px; display: flex; align-items: center; gap: 12px; height: 56px;
  }
  .logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 3px; color: var(--red); }
  .now-playing-bar { flex: 1; overflow: hidden; }
  .np-title { font-size: 13px; font-weight: 500; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .np-label { font-size: 10px; color: var(--off); letter-spacing: 1px; text-transform: uppercase; }
  .wakelock-btn {
    width: 32px; height: 32px; border-radius: 50%; background: transparent;
    border: 1px solid var(--line); cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: border-color 0.2s;
  }
  .wakelock-btn.on { border-color: var(--red); }
  .wakelock-btn svg { width: 14px; height: 14px; fill: var(--off); }
  .wakelock-btn.on svg { fill: var(--red); }

  .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .view.active { display: flex; }

  /* SETLIST */
  .setlist-header { padding: 16px 16px 10px; border-bottom: 1px solid var(--line); }
  .setlist-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--white); }
  .setlist-meta { font-size: 11px; color: var(--off); letter-spacing: 1px; margin-top: 2px; }
  .song-list { flex: 1; overflow-y: auto; padding-bottom: 80px; }
  .song-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.15s; position: relative;
  }
  .song-item:active { background: rgba(232,0,26,0.08); }
  .song-item.active { background: rgba(232,0,26,0.1); }
  .song-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--red); }
  .song-num { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--red-dim); width: 28px; flex-shrink: 0; }
  .song-item.active .song-num { color: var(--red); }
  .song-details { flex: 1; overflow: hidden; }
  .song-name { font-size: 14px; font-weight: 500; color: var(--white); }
  .song-album { font-size: 11px; color: var(--off); margin-top: 2px; }
  .song-arrow { color: rgba(255,255,255,0.15); font-size: 16px; flex-shrink: 0; }
  .song-item.active .song-arrow { color: var(--red); }

  /* SHAZAM VIEW */
  .shazam-view {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0; padding: 40px 24px; overflow: hidden;
  }
  .shazam-status { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--off); margin-bottom: 32px; min-height: 16px; }
  .shazam-btn-wrap { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 32px; }
  .ring {
    position: absolute; border-radius: 50%; border: 1px solid var(--red);
    opacity: 0; animation: none;
  }
  .ring-1 { width: 140px; height: 140px; }
  .ring-2 { width: 180px; height: 180px; }
  .ring-3 { width: 220px; height: 220px; }
  .listening .ring-1 { animation: ripple 2s 0s infinite; }
  .listening .ring-2 { animation: ripple 2s 0.4s infinite; }
  .listening .ring-3 { animation: ripple 2s 0.8s infinite; }
  @keyframes ripple { 0%{transform:scale(0.8);opacity:0.6} 100%{transform:scale(1.2);opacity:0} }

  .shazam-circle {
    width: 100px; height: 100px; border-radius: 50%;
    background: var(--red); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1; transition: transform 0.15s, background 0.3s;
  }
  .shazam-circle:active { transform: scale(0.95); }
  .shazam-circle.listening { background: #c0001a; }
  .shazam-circle.found { background: #1D9E75; }
  .shazam-circle svg { width: 40px; height: 40px; fill: white; }

  .shazam-result {
    width: 100%; max-width: 320px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 20px; text-align: center; display: none;
  }
  .shazam-result.show { display: block; }
  .result-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; color: var(--white); margin-bottom: 4px; }
  .result-artist { font-size: 13px; color: var(--off); margin-bottom: 16px; }
  .result-match { font-size: 11px; color: #1D9E75; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
  .result-nomatch { font-size: 11px; color: var(--red); letter-spacing: 1px; margin-bottom: 16px; }
  .open-lyrics-btn {
    width: 100%; padding: 12px; background: var(--red); border: none; border-radius: 8px;
    color: white; font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 2px; cursor: pointer;
  }
  .open-lyrics-btn:active { background: var(--red-dim); }
  .open-lyrics-btn:disabled { background: rgba(255,255,255,0.1); color: var(--off); cursor: default; }

  .shazam-hint { font-size: 12px; color: rgba(255,255,255,0.2); text-align: center; line-height: 1.6; margin-top: 8px; }

  /* LYRICS VIEW */
  .lyrics-topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .back-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .back-btn svg { width: 20px; height: 20px; fill: var(--off); }
  .lyrics-song-info { flex: 1; overflow: hidden; }
  .lyrics-song-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--white); }
  .lyrics-song-meta { font-size: 11px; color: var(--off); }
  .font-ctrl { display: flex; gap: 4px; flex-shrink: 0; }
  .font-btn {
    width: 28px; height: 28px; border-radius: 6px; background: var(--surface);
    border: 1px solid var(--line); cursor: pointer; color: var(--off); font-size: 11px;
    display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif;
  }
  .font-btn:active { background: var(--red-dim); color: var(--white); }

  /* YOUTUBE */
  .yt-section { flex-shrink: 0; background: #000; position: relative; }
  .yt-section.hidden { display: none; }
  #ytPlayer { width: 100%; aspect-ratio: 16/9; display: block; border: none; }
  .yt-search-bar { display: flex; gap: 8px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .yt-search-input {
    flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; color: var(--white); font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif; outline: none;
  }
  .yt-search-input:focus { border-color: var(--red); }
  .yt-search-btn { padding: 7px 14px; background: var(--red); border: none; border-radius: 6px; color: white; font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 1px; cursor: pointer; }
  .yt-results { background: var(--surface); border-bottom: 1px solid var(--line); max-height: 160px; overflow-y: auto; display: none; }
  .yt-results.show { display: block; }
  .yt-result-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .yt-result-item:active { background: rgba(232,0,26,0.1); }
  .yt-thumb { width: 60px; height: 34px; object-fit: cover; border-radius: 4px; flex-shrink: 0; background: #222; }
  .yt-result-title { font-size: 12px; color: var(--white); line-height: 1.4; }
  .yt-result-ch { font-size: 10px; color: var(--off); margin-top: 2px; }
  .yt-toggle-btn {
    position: absolute; top: 6px; right: 8px; z-index: 10;
    background: rgba(0,0,0,0.7); border: 1px solid var(--line); border-radius: 4px;
    color: var(--off); font-size: 10px; padding: 3px 8px; cursor: pointer; letter-spacing: 1px;
  }
  .yt-collapsed-bar { display: none; align-items: center; gap: 10px; padding: 8px 12px; background: #0d0d0d; border-bottom: 1px solid var(--line); cursor: pointer; flex-shrink: 0; }
  .yt-collapsed-bar.show { display: flex; }
  .yt-collapsed-icon { width: 28px; height: 28px; background: var(--red); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .yt-collapsed-icon svg { width: 14px; height: 14px; fill: white; }
  .yt-collapsed-title { flex: 1; font-size: 12px; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .yt-collapsed-expand { font-size: 10px; color: var(--off); letter-spacing: 1px; }

  .lyrics-body { flex: 1; overflow-y: auto; padding: 20px 20px 100px; }
  .lyric-block { margin-bottom: 24px; }
  .lyric-section-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin-bottom: 8px; font-weight: 500; }
  .lyric-line { font-size: 18px; line-height: 1.7; color: var(--white); font-weight: 300; transition: font-size 0.2s; }
  .lyrics-placeholder { text-align: center; padding: 40px 20px; color: var(--off); font-size: 14px; line-height: 1.8; }
  .lyrics-placeholder strong { color: var(--red); display: block; font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; margin-bottom: 8px; }

  /* ADD SONG */
  .add-song-view { flex: 1; overflow-y: auto; padding: 20px 16px 80px; }
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--off); margin-bottom: 8px; display: block; }
  .form-input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--white); font-size: 14px; font-family: 'Noto Sans TC', sans-serif; outline: none; transition: border-color 0.2s; }
  .form-input:focus { border-color: var(--red); }
  .form-textarea { min-height: 180px; resize: vertical; line-height: 1.7; }
  .form-hint { font-size: 11px; color: var(--off); margin-top: 6px; line-height: 1.6; }
  .save-btn { width: 100%; padding: 14px; background: var(--red); border: none; border-radius: 8px; color: white; font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 3px; cursor: pointer; }
  .save-btn:active { background: var(--red-dim); }
  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--white); margin-bottom: 16px; }
  .delete-btn { background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--off); font-size: 11px; padding: 4px 10px; cursor: pointer; }
  .delete-btn:active { border-color: var(--red); color: var(--red); }

  /* NAV */
  nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(8,8,8,0.97); border-top: 1px solid var(--line); display: flex; backdrop-filter: blur(10px); }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; border: none; background: none; }
  .nav-btn svg { width: 20px; height: 20px; fill: var(--off); transition: fill 0.2s; }
  .nav-btn span { font-size: 10px; color: var(--off); letter-spacing: 1px; text-transform: uppercase; transition: color 0.2s; }
  .nav-btn.active svg { fill: var(--red); }
  .nav-btn.active span { color: var(--red); }

  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">OOR LIVE</div>
  <div class="splash-sub">Concert Lyrics</div>
</div>

<div id="app">
  <header>
    <div class="logo-text">OOR</div>
    <div class="now-playing-bar">
      <div class="np-label">NOW PLAYING</div>
      <div class="np-title" id="npTitle">— 選擇歌曲 —</div>
    </div>
    <button class="wakelock-btn" id="wakelockBtn" onclick="toggleWakelock()" title="螢幕常亮">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18A9 9 0 0012 3zm0 16a7 7 0 110-14 7 7 0 010 14zm0-11a4 4 0 100 8 4 4 0 000-8zm0 6a2 2 0 110-4 2 2 0 010 4z"/></svg>
    </button>
  </header>

  <!-- SETLIST VIEW -->
  <div class="view active" id="view-setlist">
    <div class="setlist-header">
      <div class="setlist-title">SETLIST</div>
      <div class="setlist-meta" id="setlistMeta">ONE OK ROCK · 載入中...</div>
    </div>
    <div class="song-list" id="songList"></div>
  </div>

  <!-- SHAZAM VIEW -->
  <div class="view" id="view-shazam">
    <div class="shazam-view" id="shazamView">
      <div class="shazam-status" id="shazamStatus">點擊辨識正在播放的歌曲</div>
      <div class="shazam-btn-wrap" id="shazamBtnWrap">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <button class="shazam-circle" id="shazamCircle" onclick="toggleListening()">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
      </div>
      <div class="shazam-result" id="shazamResult">
        <div class="result-match" id="resultMatch"></div>
        <div class="result-title" id="resultTitle">—</div>
        <div class="result-artist" id="resultArtist">—</div>
        <button class="open-lyrics-btn" id="openLyricsBtn" onclick="openMatchedSong()">查看歌詞</button>
      </div>
      <div class="shazam-hint" id="shazamHint">把手機靠近喇叭，收音約 5 秒</div>
    </div>
  </div>

  <!-- LYRICS VIEW -->
  <div class="view" id="view-lyrics">
    <div class="lyrics-topbar">
      <div class="back-btn" onclick="showView('setlist')">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </div>
      <div class="lyrics-song-info">
        <div class="lyrics-song-title" id="lyricsSongTitle">—</div>
        <div class="lyrics-song-meta" id="lyricsSongMeta">One OK Rock</div>
      </div>
      <div class="font-ctrl">
        <div class="font-btn" onclick="changeFontSize(-1)">A-</div>
        <div class="font-btn" onclick="changeFontSize(1)">A+</div>
      </div>
    </div>

    <div class="yt-collapsed-bar" id="ytCollapsedBar" onclick="expandPlayer()">
      <div class="yt-collapsed-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      <div class="yt-collapsed-title" id="ytCollapsedTitle">YouTube 播放器</div>
      <div class="yt-collapsed-expand">展開 ›</div>
    </div>

    <div class="yt-section" id="ytSection">
      <button class="yt-toggle-btn" onclick="collapsePlayer()">收起 ↑</button>
      <iframe id="ytPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      <div class="yt-search-bar">
        <input class="yt-search-input" id="ytSearchInput" placeholder="搜尋 One OK Rock 歌曲..." />
        <button class="yt-search-btn" onclick="searchYouTube()">搜尋</button>
      </div>
      <div class="yt-results" id="ytResults"></div>
    </div>

    <div class="lyrics-body" id="lyricsBody"></div>
  </div>

  <!-- ADD SONG VIEW -->
  <div class="view" id="view-add">
    <div class="add-song-view">
      <div class="section-title">新增歌曲</div>
      <div class="form-group">
        <label class="form-label">歌曲名稱</label>
        <input class="form-input" id="inputName" placeholder="例：Wherever You Are" />
      </div>
      <div class="form-group">
        <label class="form-label">專輯</label>
        <input class="form-input" id="inputAlbum" placeholder="例：Nichesynka" />
      </div>
      <div class="form-group">
        <label class="form-label">歌詞</label>
        <textarea class="form-input form-textarea" id="inputLyrics" placeholder="貼上歌詞&#10;用 [Verse 1]、[Chorus]、[Bridge] 標記段落"></textarea>
        <div class="form-hint">標記格式：[Verse 1] [Chorus] [Bridge] [Outro]，單獨一行</div>
      </div>
      <button class="save-btn" onclick="saveSong()">儲存歌曲</button>
      <div style="margin-top:28px; border-top:1px solid var(--line); padding-top:20px;">
        <div class="section-title">已收錄歌曲</div>
        <div id="manageSongList"></div>
      </div>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" id="nav-setlist" onclick="showView('setlist')">
      <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      <span>歌單</span>
    </button>
    <button class="nav-btn" id="nav-shazam" onclick="showView('shazam')">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      <span>辨識</span>
    </button>
    <button class="nav-btn" id="nav-lyrics" onclick="showView('lyrics')">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM8 14h8v2H8v-2zm0-4h5v2H8v-2z"/></svg>
      <span>歌詞</span>
    </button>
    <button class="nav-btn" id="nav-add" onclick="showView('add')">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      <span>新增</span>
    </button>
  </nav>
</div>

  { id:'clock',     name:'Clock Strikes',          album:'Nichesynka',
    lyrics:`[Verse 1]\nDarling darling\nTime is running away from us tonight\nBut I don't care\n[Chorus]\nIf you wanna be loved\nbe loved\nbefore the clock strikes` },
  { id:'tomorrows', name:'Tomorrows',              album:'35xxxv',
    lyrics:`[Verse 1]\n見えない明日を追いかけて\n何度も転んで 立ち上がって\n[Chorus]\n向こうへ 向こうへ\nどこまでも行こう\n明日へ 明日へ\n終わらない旅を\n[Bridge]\nYou know it's gonna be alright` },
  { id:'coda',      name:'C.O.D.A.',               album:'Eye of the Storm',
    lyrics:`[Intro]\nこの物語の終わりに\n[Verse 1]\n君のことを思い出す\nあの頃の僕らを\n[Chorus]\nC.O.D.A.\n君がいた場所で\nC.O.D.A.\nまた会えるから` },
  { id:'storm',     name:'Eye of the Storm',       album:'Eye of the Storm',
    lyrics:`[Verse 1]\nWalking through the fire\nThrough the storm alone\n[Chorus]\nIn the eye of the storm\nYou remain\nIn the eye of the storm\nI'm not afraid\nIn the eye of the storm\nCalling your name` }
];

let songs = [], currentSongId = null, fontSize = 18, wakeLock = null;
let playerCollapsed = false;
let isListening = false, mediaRecorder = null, audioChunks = [], listenTimer = null;
let matchedSongId = null;

// ── DATA ─────────────────────────────────────────────
function loadSongs() {
  try {
    const s = localStorage.getItem('oor_songs');
    songs = s ? JSON.parse(s) : [...DEFAULT_SONGS];
    if (!s) saveSongsToStorage();
  } catch(e) { songs = [...DEFAULT_SONGS]; }
}
function saveSongsToStorage() {
  try { localStorage.setItem('oor_songs', JSON.stringify(songs)); } catch(e) {}
}

// ── RENDER ───────────────────────────────────────────
function renderSetlist() {
  document.getElementById('setlistMeta').textContent = `ONE OK ROCK · ${songs.length} 首`;
  document.getElementById('songList').innerHTML = songs.map((s,i) => `
    <div class="song-item ${currentSongId===s.id?'active':''}" onclick="openSong('${s.id}')">
      <div class="song-num">${String(i+1).padStart(2,'0')}</div>
      <div class="song-details">
        <div class="song-name">${s.name}</div>
        <div class="song-album">${s.album}</div>
      </div>
      <div class="song-arrow">${currentSongId===s.id?'▶':'›'}</div>
    </div>`).join('');
}
function renderManageList() {
  document.getElementById('manageSongList').innerHTML = songs.map(s => `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);">
      <div style="flex:1;"><div style="font-size:13px;color:var(--white);">${s.name}</div><div style="font-size:11px;color:var(--off);">${s.album}</div></div>
      <button class="delete-btn" onclick="deleteSong('${s.id}')">刪除</button>
    </div>`).join('');
}
function parseLyrics(raw) {
  const lines = raw.trim().split('\n');
  let blocks=[], cur=null;
  lines.forEach(line => {
    const t = line.trim();
    if (!t) { if(cur){blocks.push(cur);cur=null;} return; }
    if (/^\[.+\]$/.test(t)) { if(cur) blocks.push(cur); cur={section:t.replace(/[\[\]]/g,''),lines:[]}; }
    else { if(!cur) cur={section:null,lines:[]}; cur.lines.push(t); }
  });
  if(cur) blocks.push(cur);
  return blocks;
}

// ── OPEN SONG ────────────────────────────────────────
function openSong(id) {
  const song = songs.find(s=>s.id===id);
  if (!song) return;
  currentSongId = id;
  document.getElementById('npTitle').textContent = song.name;
  document.getElementById('lyricsSongTitle').textContent = song.name;
  document.getElementById('lyricsSongMeta').textContent = song.album + ' · One OK Rock';
  const body = document.getElementById('lyricsBody');
  if (!song.lyrics || !song.lyrics.trim()) {
    body.innerHTML = `<div class="lyrics-placeholder"><strong>尚未收錄歌詞</strong>點「新增」貼上歌詞</div>`;
  } else {
    const blocks = parseLyrics(song.lyrics);
    body.innerHTML = blocks.map(b=>`
      <div class="lyric-block">
        ${b.section?`<div class="lyric-section-label">${b.section}</div>`:''}
        ${b.lines.map(l=>`<div class="lyric-line" style="font-size:${fontSize}px">${l}</div>`).join('')}
      </div>`).join('');
  }
  body.scrollTop = 0;
  document.getElementById('ytSearchInput').value = 'One OK Rock ' + song.name;
  searchYouTube();
  showView('lyrics');
  renderSetlist();
}
function changeFontSize(d) {
  fontSize = Math.max(14,Math.min(28,fontSize+d));
  document.querySelectorAll('.lyric-line').forEach(el=>el.style.fontSize=fontSize+'px');
}

// ── ACRCloud RECOGNITION ─────────────────────────────
function buildACRSignature() {
  const method='POST', uri='/v1/identify', ts=Math.floor(Date.now()/1000).toString();
  const sigStr = [method,uri,'audio/mpeg','1',ts].join('\n');
  const sig = CryptoJS.HmacSHA1(sigStr, ACR_SECRET);
  return { signature: CryptoJS.enc.Base64.stringify(sig), timestamp: ts };
}

async function toggleListening() {
  if (isListening) { stopListening(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    startListening(stream);
  } catch(e) {
    setShazamStatus('無法取得麥克風權限，請允許後再試');
  }
}

function startListening(stream) {
  isListening = true;
  audioChunks = [];
  matchedSongId = null;

  const circle = document.getElementById('shazamCircle');
  const wrap   = document.getElementById('shazamBtnWrap');
  circle.classList.add('listening');
  wrap.classList.add('listening');
  document.getElementById('shazamResult').classList.remove('show');
  setShazamStatus('正在聆聽...');
  document.getElementById('shazamHint').style.display = 'none';

  mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
  mediaRecorder.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    stream.getTracks().forEach(t=>t.stop());
    identifyAudio();
  };
  mediaRecorder.start();
  listenTimer = setTimeout(() => stopListening(), 6000);
  updateCountdown(6);
}

function updateCountdown(n) {
  if (!isListening || n <= 0) return;
  setShazamStatus(`正在聆聽... ${n}秒`);
  setTimeout(() => updateCountdown(n-1), 1000);
}

function stopListening() {
  if (!isListening) return;
  isListening = false;
  clearTimeout(listenTimer);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  const circle = document.getElementById('shazamCircle');
  const wrap   = document.getElementById('shazamBtnWrap');
  circle.classList.remove('listening');
  wrap.classList.remove('listening');
  setShazamStatus('辨識中...');
}

async function identifyAudio() {
  if (audioChunks.length === 0) { setShazamStatus('收音失敗，請再試'); return; }
  try {
    const blob = new Blob(audioChunks, { type:'audio/webm' });
    const { signature, timestamp } = buildACRSignature();
    const form = new FormData();
    form.append('sample', blob, 'sample.webm');
    form.append('access_key', ACR_KEY);
    form.append('sample_bytes', blob.size);
    form.append('timestamp', timestamp);
    form.append('signature', signature);
    form.append('data_type', 'audio');
    form.append('signature_version', '1');

    const res  = await fetch(`https://${ACR_HOST}/v1/identify`, { method:'POST', body:form });
    const data = await res.json();
    handleACRResult(data);
  } catch(e) {
    setShazamStatus('辨識失敗，請確認網路連線');
    document.getElementById('shazamHint').style.display = '';
    resetShazamBtn();
  }
}

function handleACRResult(data) {
  const resultEl  = document.getElementById('shazamResult');
  const matchEl   = document.getElementById('resultMatch');
  const titleEl   = document.getElementById('resultTitle');
  const artistEl  = document.getElementById('resultArtist');
  const lyricsBtn = document.getElementById('openLyricsBtn');

  resetShazamBtn();
  resultEl.classList.add('show');
  document.getElementById('shazamHint').style.display = '';

  if (data.status?.code === 0 && data.metadata?.music?.length > 0) {
    const music  = data.metadata.music[0];
    const title  = music.title || '未知歌曲';
    const artist = music.artists?.[0]?.name || '未知歌手';

    titleEl.textContent  = title;
    artistEl.textContent = artist;

    // Try to find in our setlist (fuzzy match)
    const found = songs.find(s =>
      s.name.toLowerCase().includes(title.toLowerCase()) ||
      title.toLowerCase().includes(s.name.toLowerCase())
    );

    if (found) {
      matchedSongId = found.id;
      matchEl.textContent = '✓ 找到歌詞';
      matchEl.className   = 'result-match';
      lyricsBtn.disabled  = false;
      lyricsBtn.textContent = '查看歌詞 →';
      setShazamStatus('辨識成功！');
      document.getElementById('npTitle').textContent = found.name;
    } else {
      matchedSongId = null;
      matchEl.textContent = '歌單中未收錄此歌曲';
      matchEl.className   = 'result-nomatch';
      lyricsBtn.disabled  = true;
      lyricsBtn.textContent = '未收錄歌詞';
      setShazamStatus('辨識成功，但歌單未收錄');
    }
  } else {
    titleEl.textContent  = '辨識不到歌曲';
    artistEl.textContent = '請靠近喇叭再試一次';
    matchEl.textContent  = '';
    lyricsBtn.disabled   = true;
    lyricsBtn.textContent = '重新辨識';
    lyricsBtn.disabled = false;
    lyricsBtn.onclick = () => { resultEl.classList.remove('show'); };
    setShazamStatus('辨識失敗');
  }
}

function openMatchedSong() {
  if (matchedSongId) openSong(matchedSongId);
}

function resetShazamBtn() {
  const circle = document.getElementById('shazamCircle');
  circle.classList.remove('listening','found');
}
function setShazamStatus(txt) {
  document.getElementById('shazamStatus').textContent = txt;
}

// ── YOUTUBE ──────────────────────────────────────────
async function searchYouTube() {
  const q = document.getElementById('ytSearchInput').value.trim();
  if (!q) return;
  const resultsEl = document.getElementById('ytResults');
  resultsEl.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:var(--off);">搜尋中...</div>';
  resultsEl.classList.add('show');
  try {
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&type=video&maxResults=5&key=${YT_API_KEY}`;
    const res  = await fetch(url);
    const data = await res.json();
    if (!data.items?.length) { resultsEl.innerHTML='<div style="padding:10px 12px;font-size:12px;color:var(--off);">找不到結果</div>'; return; }
    resultsEl.innerHTML = data.items.map(item=>`
      <div class="yt-result-item" onclick="playVideo('${item.id.videoId}',\`${item.snippet.title.replace(/`/g,"'")}\`)">
        <img class="yt-thumb" src="${item.snippet.thumbnails.default.url}" loading="lazy"/>
        <div><div class="yt-result-title">${item.snippet.title}</div><div class="yt-result-ch">${item.snippet.channelTitle}</div></div>
      </div>`).join('');
  } catch(e) {
    resultsEl.innerHTML='<div style="padding:10px 12px;font-size:12px;color:var(--red);">搜尋失敗</div>';
  }
}
function playVideo(videoId, title) {
  document.getElementById('ytPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
  document.getElementById('ytResults').classList.remove('show');
  document.getElementById('ytCollapsedTitle').textContent = title;
  if (playerCollapsed) expandPlayer();
}
function collapsePlayer() {
  playerCollapsed = true;
  document.getElementById('ytSection').classList.add('hidden');
  document.getElementById('ytCollapsedBar').classList.add('show');
}
function expandPlayer() {
  playerCollapsed = false;
  document.getElementById('ytSection').classList.remove('hidden');
  document.getElementById('ytCollapsedBar').classList.remove('show');
}

// ── NAVIGATION ───────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  const nb = document.getElementById('nav-'+name);
  if(nb) nb.classList.add('active');
  if(name==='add') renderManageList();
}

// ── SONG MANAGEMENT ──────────────────────────────────
function saveSong() {
  const name   = document.getElementById('inputName').value.trim();
  const album  = document.getElementById('inputAlbum').value.trim();
  const lyrics = document.getElementById('inputLyrics').value.trim();
  if (!name) { alert('請輸入歌曲名稱'); return; }
  songs.push({ id:'song_'+Date.now(), name, album:album||'One OK Rock', lyrics });
  saveSongsToStorage();
  document.getElementById('inputName').value='';
  document.getElementById('inputAlbum').value='';
  document.getElementById('inputLyrics').value='';
  renderSetlist(); renderManageList();
  alert('✓ 已儲存：'+name);
}
function deleteSong(id) {
  if (!confirm('確定要刪除這首歌嗎？')) return;
  songs = songs.filter(s=>s.id!==id);
  if (currentSongId===id) currentSongId=null;
  saveSongsToStorage(); renderSetlist(); renderManageList();
}

// ── WAKELOCK ─────────────────────────────────────────
async function toggleWakelock() {
  const btn = document.getElementById('wakelockBtn');
  if (wakeLock) {
    try { await wakeLock.release(); } catch(e) {}
    wakeLock=null; btn.classList.remove('on');
  } else {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      btn.classList.add('on');
      wakeLock.addEventListener('release',()=>{ wakeLock=null; btn.classList.remove('on'); });
    } catch(e) { alert('此瀏覽器不支援螢幕常亮\n建議使用 Chrome 或 Safari 15+'); }
  }
}

// ── INIT ─────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('ytSearchInput').addEventListener('keydown', e => { if(e.key==='Enter') searchYouTube(); });
});
window.addEventListener('load', () => {
  loadSongs(); renderSetlist();
  setTimeout(()=>{ document.getElementById('splash').classList.add('hide'); }, 1400);
});
</script>
